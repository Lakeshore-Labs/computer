[package]
name = "claim-reader"
version = "0.1.0"
edition = "2021"
[dependencies]
base64 = "0.22"
image = {version = "0.25", default-features = false, features = ["png"]}
quircs = "0.10.3"
rmcp = {version = "=3.11.0", default-features = false, features = ["client","transport-child-process"]}
serde_json = "1"
tokio = {version = "1",features=["macros","rt","process"]}
[profile.dev]
debug = 0
incremental = false
