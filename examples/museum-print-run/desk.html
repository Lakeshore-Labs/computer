<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Postcard print run · Saint-Rémy</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0ecdf;color:#26362e;font:16px/1.48 system-ui,sans-serif}main{max-width:1360px;margin:auto;padding:clamp(17px,4vw,56px)}header{border-top:4px solid #283c32;padding-top:15px}h1{font:normal clamp(44px,6vw,88px)/1.02 Georgia,serif;letter-spacing:-.05em;margin:.12em 0 .18em}header p{max-width:790px;margin:0 0 24px}small{color:#55645b}section{display:grid;grid-template-columns:3fr 1fr;align-items:start;gap:clamp(18px,3vw,38px)}figure{margin:0}figure img{width:100%;display:block;background:#f7f3e8;box-shadow:0 5px 13px #2e382b2b}figcaption{font-size:14px;color:#586258;margin:10px 0}fieldset{border:0;margin:0;padding:0}legend,h2{font:normal 25px Georgia,serif;margin:.15em 0 .6em}label{display:block;cursor:pointer;padding:10px 0;border-bottom:1px solid #a6ac98}input{accent-color:#284f3d}output{display:block;color:#2e5742;font-weight:600;margin:.9em 0}a{color:#23533f;text-underline-offset:3px}a.action{display:inline-block;padding:10px 14px;background:#315445;color:white;margin:0 0 18px}details{border-top:1px solid #a6ac98;padding:12px 0;margin-top:15px}summary{cursor:pointer}code{font-size:12px;overflow-wrap:anywhere}aside img{width:100%;border:1px solid #b3baa9}aside p{margin:.5em 0}.jobs{margin-top:14px}@media(max-width:720px){section{grid-template-columns:1fr}.settings{grid-row:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}.settings>details,.settings .jobs{grid-column:1/-1}.settings .jobs{margin:0}h1{margin-bottom:.3em}}@media(max-width:410px){.settings{display:block}.jobs summary{font-size:14px}}
</style><main><header><small>Museum proof press · Four-up A4</small><h1>The postcard print run</h1><p>The museum changed its order after the first proof. Compare the sheets and open the PDF that reached the virtual print queue.</p></header>
<section><figure><img id="proof" alt=""><figcaption id="caption"></figcaption></figure><aside class="settings"><fieldset><legend>Print edition</legend><label><input type="radio" name="edition" value="first"> First proof</label><label><input type="radio" name="edition" value="amended" checked> Amended order</label></fieldset><div><output id="counts" aria-live="polite"></output><a class="action" id="download" download>Download sheet PDF</a><p id="status"></p></div><details class="jobs"><summary>Printer receipt</summary><p id="queue"></p><code id="digest"></code><p id="native"></p></details></aside></section></main>
<script type="application/json" id="data">{{DATA}}</script><script>
const r=JSON.parse(document.querySelector('#data').textContent);const $=id=>document.getElementById(id);
function paint(){const id=document.querySelector('input:checked').value,t=r[id];
$('proof').src=id+'/sheet.png';$('proof').alt=t.slots.map((m,i)=>(i+1)+'. '+(m==='getty'?'Irises':'The Large Plane Trees')).join(', ');
$('caption').textContent='A4 landscape · 297 × 210 mm · four A6 postcards';$('counts').textContent=t.copies.getty+' Getty · '+t.copies.cleveland+' Cleveland';$('download').href='data:application/pdf;base64,'+r.pdfs[id];$('download').download=id+'-postcards.pdf';
$('status').textContent=id==='first'?'Retained as the first proof.':'Completed by the local IPP printer emulator.';}
document.querySelectorAll('input').forEach(n=>n.onchange=paint);paint();
const j=r.completed_jobs[0];$('queue').textContent='Job '+j['job-id']+' · '+j['job-name']+' · completed (IPP state '+j['job-state']+')';
$('digest').textContent='Spool SHA-256 '+r.spool_pdf_sha256;
if(r.queue_capture){const a=document.createElement('a');a.href='queue.png';a.textContent='Open the actual printer status screen';$('native').append(a);}
</script></html>
