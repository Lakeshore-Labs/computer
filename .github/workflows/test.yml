name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  PYTHON_RELEASE: python-3.15.2-1
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Fetch the Python build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$PYTHON_RELEASE" --pattern '*.tar.gz*' --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP" && sha256sum -c python-3.15.2-wasi.tar.gz.sha256
          mkdir python-wasi && tar -xzf python-3.15.2-wasi.tar.gz -C python-wasi
      # stdmethods objects to the Seek method wazero's file interface requires.
      - run: go vet -stdmethods=false ./...
      - name: Test
        env:
          PYTHON_HOST_MODULE: computer
        run: PYTHON_WASM="$RUNNER_TEMP/python-wasi/python.wasm" PYTHON_LIB="$RUNNER_TEMP/python-wasi/lib" go test -count=1 -timeout 900s .
