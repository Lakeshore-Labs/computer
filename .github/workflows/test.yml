name: test
# Runs for a pull request and when started by hand, not on every push.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # stdmethods objects to the Seek method wazero's file interface requires.
      - run: go vet -stdmethods=false ./...
      - name: Test
        run: go test -count=1 -timeout 900s -v . ./cmd/computer | grep -vE '^=== (RUN|PAUSE|CONT|NAME)' ; exit "${PIPESTATUS[0]}"
