# Bundles the agent from agent/js, tests the command agent with it on the pinned QuickJS, and, for a tag named
# agent-*, attaches both files to a release.
name: agent
on:
  workflow_dispatch:
  push:
    tags: ['agent-*']
permissions:
  contents: write
env:
  QUICKJS_URL: https://github.com/quickjs-ng/quickjs/releases/download/v0.18.0/qjs-wasi.wasm
  QUICKJS_SHA256: 2c218412cb8b17e46ee91bea7556ec38f5b9b6bd6312fddd3ceeed14aa71eaaa
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Bundle
        working-directory: agent/js
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Fetch QuickJS
        run: |
          mkdir out
          cp agent/js/dist/*.js out/
          curl -fsSL -o out/qjs-wasi.wasm "$QUICKJS_URL"
          echo "$QUICKJS_SHA256  out/qjs-wasi.wasm" | sha256sum -c
      - name: Test
        run: AGENT_ENGINE="$PWD/out/qjs-wasi.wasm" AGENT_BUNDLE="$PWD/out" go test -count=1 -timeout 600s -run Agent -v . | grep -E '^(--- |ok|FAIL|PASS)' ; exit "${PIPESTATUS[0]}"
      - name: Package
        run: |
          tar -C out -czf agent.tar.gz agent.js qjs-wasi.wasm
          sha256sum agent.tar.gz | tee agent.tar.gz.sha256
      - name: Release
        if: startsWith(github.ref, 'refs/tags/agent-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" agent.tar.gz agent.tar.gz.sha256
          --title "The agent ($GITHUB_REF_NAME)"
          --notes "Pi Durable bundled for QuickJS, and QuickJS v0.18.0 built for WASI. Built by this workflow from agent/js at $GITHUB_SHA."
