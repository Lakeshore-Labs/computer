# Builds CPython for WASI from python/build.sh, tests the computer against it, and, for a tag named python-*,
# attaches the build to a release and opens a pull request that makes it the build embedded in the module.
name: python
on:
  workflow_dispatch:
  push:
    tags: ['python-*']
permissions:
  contents: write
  pull-requests: write
  actions: write # to start test.yml, which a pull request made with this workflow's token does not start
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build CPython
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ca-certificates curl unzip
          mkdir "$RUNNER_TEMP/work"
          cd "$RUNNER_TEMP/work"
          sh "$GITHUB_WORKSPACE/python/build.sh"
      - name: Test the computer against it
        env:
          PYTHON_HOST_MODULE: computer
        run: PYTHON_WASM="$RUNNER_TEMP/work/dist/python.wasm" PYTHON_LIB="$RUNNER_TEMP/work/dist/lib" go test -count=1 -timeout 900s .
      - name: Package
        run: |
          tar -C "$RUNNER_TEMP/work/dist" -czf python-3.15.2-wasi.tar.gz python.wasm lib
          sha256sum python-3.15.2-wasi.tar.gz | tee python-3.15.2-wasi.tar.gz.sha256
      - name: Release
        if: startsWith(github.ref, 'refs/tags/python-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" python-3.15.2-wasi.tar.gz python-3.15.2-wasi.tar.gz.sha256
          --title "CPython 3.15.2 for WASI ($GITHUB_REF_NAME)"
          --notes "Built by this workflow from python/build.sh at $GITHUB_SHA. See python/README.md."
      - name: Embed
        if: startsWith(github.ref, 'refs/tags/python-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git switch -c "embed-$GITHUB_REF_NAME" origin/main
          cp python-3.15.2-wasi.tar.gz python/python-wasi.tar.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add python/python-wasi.tar.gz
          git commit -m "The embedded Python is $GITHUB_REF_NAME"
          git push origin "embed-$GITHUB_REF_NAME"
          gh pr create --base main --head "embed-$GITHUB_REF_NAME" --title "The embedded Python is $GITHUB_REF_NAME" \
            --body "Embeds the build of release $GITHUB_REF_NAME, made by the python workflow at $GITHUB_SHA."
          gh workflow run test.yml --ref "embed-$GITHUB_REF_NAME"
